aid: shine-technologies
name: SHINE Technologies
description: >-
  SHINE Technologies is a privately held fusion technology company founded in 2010 and
  headquartered in Janesville, Wisconsin, that operates fusion neutron generators at
  industrial scale. High-current particle beams strike a tritium gas target to produce an
  intense neutron flux, which SHINE applies across four staged business phases: neutron
  imaging and radiation-effects testing (the Phoenix Imaging Center, the FLARE 14 MeV
  radiation-effects service, and a nuclear fuel scanner), medical isotope production
  (Cassiopeia, which makes the non-carrier-added lutetium-177 product Ilumira, and
  Chrysalis, a molybdenum-99 facility backed by a conditional $263M U.S. Department of
  Energy loan), used nuclear fuel recycling (the REDUCE process, with partners including
  Orano and Deep Isolation), and ultimately fusion energy. SHINE designs and manufactures
  its own particle accelerators, fusion targets and radiochemical processing systems, and
  merged with Phoenix LLC in 2022. It is a manufacturer of hardware and radiopharmaceuticals
  rather than a software company, and publishes no public API, SDK, developer portal or
  machine-readable contract of any kind.
